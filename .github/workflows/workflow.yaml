name: Ship CRISPR workflow

on:
  push:
    branches: ["master","development"]
  pull_request:
    branches: ["master","development"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Test all supported Python versions under Ubuntu
        os: [ubuntu-latest]
        # os: [ubuntu-latest, windows-latest, macos-latest]

        python-version: ['3.12', '3.13', '3.14']

    runs-on: ${{ matrix.os }}

    container:
      image: ghcr.io/${{ github.repository_owner }}/crispr_analysis:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Run tests
      run: uv run pytest test/test_workflow.py --cov=./ --cov-report=xml
    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        ruff check --select=E9,F63,F7,F82
        # exit-zero treats all errors as warnings
        ruff check --exit-zero --statistics
