name: Ship CRISPR workflow

on:
  push:
    branches: ["master","development"]
  pull_request:
    branches: ["master","development"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Test all supported Python versions under Ubuntu
        os: [ubuntu-latest]
        # os: [ubuntu-latest, windows-latest, macos-latest]

        python-version: ['3.12', '3.13', '3.14']

    runs-on: ${{ matrix.os }}

    container:
      image: ghcr.io/${{ github.repository_owner }}/crispr_analysis:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Run tests
      run: uv run pytest --cov=./ --cov-report=xml
      # run: uv run pytest --cov=./ --cov-report=xml --cov-fail-under=80
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        ruff check --select=E9,F63,F7,F82
        # exit-zero treats all errors as warnings
        ruff check --exit-zero --statistics
